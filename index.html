<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bingo Digital</title>
<style>
  :root { --bg:#12141c; --card:#1d2130; --ink:#f3f4f8; --mute:#9aa0b4; --acc:#ffb703; --bad:#e5484d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--ink); padding:12px; max-width:720px; margin-inline:auto; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  button, .btn { background:var(--card); color:var(--ink); border:1px solid #333a52; border-radius:10px; padding:10px 14px; font-size:1rem; cursor:pointer; }
  .btn.primary { background:var(--acc); color:#222; border-color:var(--acc); font-weight:700; }
  button.danger { background:var(--bad); border-color:var(--bad); font-weight:700; }
  button.tab.on { background:var(--acc); color:#222; border-color:var(--acc); font-weight:700; }
  #hint { color:var(--mute); font-size:.9rem; margin:6px 0; }
  #wrap { position:relative; touch-action:manipulation; line-height:0; border-radius:8px; overflow:hidden; user-select:none; -webkit-user-select:none; }
  #wrap img { width:100%; display:block; pointer-events:none; }
  .mark { position:absolute; width:7%; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:50%; background:rgba(229,72,77,.55); border:3px solid rgba(229,72,77,.95); pointer-events:none; }
</style>
</head>
<body>

<div class="row">
  <label class="btn primary">📷 Subir foto del tablero
    <input id="file" type="file" accept="image/*" hidden>
  </label>
  <button id="reset" class="danger">Reset</button>
  <button id="del">Borrar tablero</button>
</div>
<div class="row" id="tabs"></div>
<div id="hint"></div>
<div id="wrap"></div>

<script>
const KEY = 'bingo-v2';
const R = 3.5; // radio de la marca, % del ancho
let boards = [];   // [{img: dataURL, marks: [[x%, y%]]}]
let cur = 0;

try { boards = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
const $ = id => document.getElementById(id);
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(boards)); }
  catch (e) { alert('No hay espacio para guardar. Borra algún tablero.'); }
}

function render() {
  if (cur >= boards.length) cur = Math.max(0, boards.length - 1);
  $('tabs').innerHTML = '';
  if (boards.length > 1) boards.forEach((_, i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i === cur ? ' on' : '');
    b.textContent = 'Tablero ' + (i + 1);
    b.onclick = () => { cur = i; render(); };
    $('tabs').appendChild(b);
  });
  const wrap = $('wrap');
  wrap.innerHTML = '';
  const b = boards[cur];
  $('hint').textContent = b ? 'Toca un número para marcarlo. Toca una marca para quitarla.' : 'Sube una foto de tu tablero para empezar.';
  if (!b) return;
  const img = new Image();
  img.src = b.img;
  wrap.appendChild(img);
  b.marks.forEach(([x, y]) => {
    const m = document.createElement('div');
    m.className = 'mark';
    m.style.left = x + '%'; m.style.top = y + '%';
    wrap.appendChild(m);
  });
}

$('wrap').addEventListener('click', e => {
  const b = boards[cur];
  if (!b) return;
  const r = $('wrap').getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * 100;
  const y = (e.clientY - r.top) / r.height * 100;
  const k = b.marks.findIndex(([mx, my]) => Math.hypot(mx - x, (my - y) * r.height / r.width) < R);
  if (k >= 0) b.marks.splice(k, 1); else b.marks.push([x, y]);
  save(); render();
});

$('reset').onclick = () => {
  if (!boards.length || !confirm('¿Borrar todas las marcas?')) return;
  boards.forEach(b => b.marks = []);
  save(); render();
};
$('del').onclick = () => {
  if (!boards.length || !confirm('¿Borrar este tablero?')) return;
  boards.splice(cur, 1); save(); render();
};

$('file').onchange = e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  const img = new Image();
  img.onload = () => {
    const s = Math.min(1, 1400 / Math.max(img.width, img.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    boards.push({ img: cv.toDataURL('image/jpeg', 0.82), marks: [] });
    cur = boards.length - 1;
    save(); render();
  };
  img.src = URL.createObjectURL(f);
};

render();
</script>
</body>
</html>
